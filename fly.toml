# Fly.io config for the AcquireML backend demo.
# Deploy with: fly launch --copy-config --name <your-app-name>   (first time)
#              fly deploy                                        (after that)
app = "acquireml-api"
primary_region = "iad"

[build]

[env]
  PORT = "8000"

[[mounts]]
  source = "acquireml_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
